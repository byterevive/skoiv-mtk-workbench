name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  worker:
    name: Worker tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install worker (dev extra)
        run: uv sync --extra dev
      - name: Run tests
        run: uv run --no-sync python -m pytest -q

  desktop:
    name: Desktop UI (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  shell:
    name: Tauri shell (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (generate_context embeds dist/)
        run: pnpm build
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if cargo check 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee cargo-out.txt; then
            echo "cargo check passed"
          else
            echo "::error::cargo check failed - raw output tail follows"
            # Always surface the raw tail (<=10 annotations per step are kept).
            tail -n 8 cargo-out.txt | sed 's/^/::error::/' || true
            # Publish full diagnostics as a check-run summary (readable via API).
            tail -c 48000 cargo-out.txt > cargo-tail.txt
            {
              echo '```'
              cat cargo-tail.txt
              echo '```'
            } > cargo-summary.md
            gh api "repos/${{ github.repository }}/check-runs" \
              -f name="cargo-diagnostics" \
              -f head_sha="${{ github.sha }}" \
              -f status=completed \
              -f conclusion=failure \
              -f "output[title]=cargo check failed" \
              -F "output[summary]=@cargo-summary.md" || true
            exit 1
          fi
