name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  worker:
    name: Worker tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install worker (dev extra)
        run: uv sync --extra dev
      - name: Run tests
        run: uv run --no-sync python -m pytest -q

  desktop:
    name: Desktop UI (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  shell:
    name: Tauri shell (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (generate_context embeds dist/)
        run: pnpm build
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if cargo check 2>&1 | tee cargo-out.txt; then
            echo "cargo check passed"
          else
            echo "::error::cargo check failed - compiler diagnostics follow"
            grep -E "^(error|warning)(\[|:)" -A 6 cargo-out.txt | head -120 | \
              sed 's/^/::error::/' || true
            # Fallback channel: publish the log tail in an issue so the
            # diagnostics are readable even where workflow logs are not.
            tail -c 40000 cargo-out.txt > cargo-tail.txt
            gh issue create \
              --title "[ci] cargo check failed on ${{ github.sha }}" \
              --body-file cargo-tail.txt \
              --label "ci-log" 2>/dev/null || \
            gh issue create \
              --title "[ci] cargo check failed on ${{ github.sha }}" \
              --body-file cargo-tail.txt || true
            exit 1
          fi
