[package]
name = "skoiv-mtk-workbench"
version = "0.2.0"
description = "Skoiv MTK Workbench desktop shell (Tauri 2)"
authors = ["Skoiv Labs"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
